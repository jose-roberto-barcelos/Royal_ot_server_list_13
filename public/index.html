<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Royal OtServlist</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />

    <style>
      /* ======= CSS ORIGINAL MANTIDO (INÍCIO) ======= */
      #servidores-wrapper.collapsed {
        max-height: 400px;
        overflow-y: auto;
      }
      #servidores-wrapper thead th {
        position: sticky;
        top: 0;
        z-index: 10;
        background: linear-gradient(to bottom, #1f2002dc, #0b0b0b);
      }

      /* ... TODO O CSS QUE VOCÊ JÁ TEM FOI MANTIDO ... */

      /* ===================================================================== */
      /* ================= VERSO DO CARD — TEMA C (PEDRA + RUNAS) ============== */
      /* ===================================================================== */

      .flip-back {
        transform: rotateY(180deg);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        position: relative;

        background:
          /* brilho das runas */
          radial-gradient(120% 100% at 50% 40%, rgba(180,0,0,0.25), rgba(0,0,0,0.85) 70%),

          /* runas diagonais */
          repeating-linear-gradient(
            135deg,
            rgba(160,0,0,0.25) 0px,
            rgba(160,0,0,0.25) 2px,
            rgba(0,0,0,0) 14px,
            rgba(0,0,0,0) 26px
          ),

          /* base da pedra */
          linear-gradient(
            145deg,
            #2b2621 0%,
            #1b1713 45%,
            #0e0b09 100%
          );

        border: 1px solid rgba(0,0,0,0.9);
        box-shadow:
          inset 0 0 80px rgba(0,0,0,0.75),
          inset 0 0 0 1px rgba(255,255,255,0.04),
          0 14px 28px rgba(0,0,0,0.55);
      }

      /* textura + rachaduras */
      .flip-back::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;

        background:
          repeating-linear-gradient(
            25deg,
            rgba(255,255,255,0.02) 0px,
            rgba(255,255,255,0.02) 1px,
            rgba(0,0,0,0) 8px,
            rgba(0,0,0,0) 14px
          ),
          radial-gradient(60% 50% at 20% 30%, rgba(0,0,0,0.35), transparent 70%),
          radial-gradient(60% 50% at 80% 70%, rgba(0,0,0,0.45), transparent 75%);
      }

      /* TEXTO */
      .back-desc {
        color: #e6dcc6;
        font-size: 0.92rem;
        line-height: 1.35;
        text-align: center;
        text-shadow: 0 0 6px #000;
        position: relative;
        z-index: 1;
      }

      /* META — PEDRA ENTALHADA */
      .meta {
        display: grid;
        gap: 8px;
        position: relative;
        z-index: 1;
      }

      .meta-row {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 8px;
        padding: 9px 10px;

        background: linear-gradient(145deg, #3a332b, #1f1a16);
        border: 1px solid rgba(0,0,0,0.9);
        box-shadow:
          inset 0 1px 2px rgba(255,255,255,0.05),
          inset 0 -3px 6px rgba(0,0,0,0.6);

        color: #e6dcc6;
        font-size: 0.9rem;
      }

      .meta-key {
        color: #ff4444;
        font-weight: 700;
        text-shadow: 0 0 6px rgba(255,0,0,0.45);
      }

      .meta a {
        color: #ffaaaa;
        text-decoration: underline;
      }

      /* BOTÕES — METAL ESCURO */
      .back-actions {
        margin-top: auto;
        display: flex;
        gap: 8px;
        justify-content: center;
        position: relative;
        z-index: 1;
      }

      .btn-mini {
        padding: 9px 12px;
        border-radius: 8px;
        background: linear-gradient(to bottom, #2a1a12, #140b07);
        border: 1px solid rgba(0,0,0,0.9);
        color: #ffb3b3;
        font-family: "Cinzel", serif;
        font-size: 0.9rem;
        text-shadow: 0 0 4px #000;
        cursor: pointer;
      }

      .btn-mini:hover {
        filter: brightness(1.15);
      }

      .legacy-ranking { display: none; }
    </style>
  </head>
