<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Votação – Bracinho de Dino</title>

    <!-- Firebase SDKs (compat) – mantém como está no seu projeto -->
    <script defer src="/__/firebase/11.10.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/11.10.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/11.10.0/firebase-firestore-compat.js"></script>

    <!-- ❗ IMPORTANTE: REMOVA a linha init.js do emulador -->
    <!-- (Se existir no seu arquivo antigo) NÃO use:
         <script defer src="/__/firebase/init.js?useEmulator=true"></script>
         Isso conecta nos EMULADORES e vai quebrar a votação online. -->

    <!-- Seu config real (você já tem esse arquivo no projeto) -->
    <script defer src="/firebase-config.js"></script>

    <style>
      body{margin:0;background:#0e0e0e;color:#eee;font-family:system-ui,Segoe UI,Roboto,Arial}
      .container{max-width:1100px;margin:0 auto;padding:20px}
      .titulo{margin:10px 0 6px;font-size:24px;text-transform:uppercase;letter-spacing:.5px}
      .sub{opacity:.9;margin-bottom:18px}
      .painel{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
      .badge{padding:6px 10px;border:1px solid rgba(255,215,0,.6);border-radius:999px}
      .btn{padding:8px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);cursor:pointer}
      .btn-ouro{background:linear-gradient(#d6b14d,#a47f1f)}
      .btn-escuro{background:#1a1a1a}
      .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
      @media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}
      @media(max-width:560px){.grid{grid-template-columns:1fr}}
      .card{background:#171717;border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden}
      .thumb{aspect-ratio:16/9;width:100%;display:block}
      .miolo{padding:10px}
      .titulo-card{font-weight:600;margin-bottom:6px}
      .acoes{display:flex;gap:8px;align-items:center;justify-content:space-between}
      .prog{margin-top:8px;height:8px;background:#222;border-radius:999px;overflow:hidden}
      .barra{height:100%;width:0}
      .status{min-height:22px;margin-top:8px}
      .box-result{margin-top:18px;background:#121212;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px}
    </style>
  </head>

  <body>
    <main class="container">
      <h1 class="titulo">Votação – Bracinho de Dino (mês atual)</h1>
      <p class="sub">Escolha a jogada mais “burra” entre as 8 finalistas. 1 voto por conta.</p>

      <div class="painel">
        <span id="poll-label" class="badge">Carregando votação…</span>
        <div>
          <button id="btn-login" class="btn btn-ouro">Entrar</button>
          <button id="btn-logout" class="btn btn-escuro" style="display:none">Sair</button>
        </div>
      </div>

      <section id="grid" class="grid"></section>

      <div style="margin-top:12px">
        <button id="btn-votar" class="btn btn-ouro" disabled>Escolha uma jogada para votar</button>
        <div id="msg" class="status"></div>
      </div>

      <div class="box-result">
        <h3>Resultados parciais</h3>
        <div id="resultados"></div>
        <small>Contagem em tempo real (1 voto por usuário).</small>
      </div>
    </main>

    <!-- Script da votação -->
    <script defer src="/js/polls.js"></script>
  </body>
</html>
