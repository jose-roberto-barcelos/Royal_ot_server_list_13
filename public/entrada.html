<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Royal OtServlist — Entrada</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root{
        --goldA:#fff2b0;
        --goldB:#ffcc66;
        --goldC:#a8741a;

        --ink: rgba(255,255,255,0.92);
        --muted: rgba(255,255,255,0.75);

        --panelA: rgba(0,0,0,0.58);
        --panelB: rgba(0,0,0,0.38);

        --line: rgba(255,204,102,0.26);
        --lineStrong: rgba(255,204,102,0.42);
      }

      *{ box-sizing:border-box; }
      html,body{ height:100%; margin:0; }
      body{
        font-family:"Cinzel", serif;
        background:#000;
        overflow:hidden;
      }

      /* ===== Background video/image ===== */
      .stage{
        position:relative;
        width:100%;
        height:100%;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:24px;
      }

      .bg-video{
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        object-fit:cover;
        object-position:center;
        transform: scale(1.03);
        filter: contrast(1.05) saturate(1.05);
      }

      /* se ainda não tiver video, esse fundo garante que não fica “preto feio” */
      .bg-fallback{
        position:absolute;
        inset:0;
        background:
          radial-gradient(1000px 650px at 50% 35%, rgba(255,255,255,0.06) 0%, rgba(0,0,0,0.70) 70%, rgba(0,0,0,0.92) 100%),
          linear-gradient(to bottom, rgba(0,0,0,0.28), rgba(0,0,0,0.78));
      }

      /* Vinheta + “cinema” */
      .vignette{
        position:absolute;
        inset:0;
        pointer-events:none;
        background:
          radial-gradient(1100px 750px at 50% 38%, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0.62) 70%, rgba(0,0,0,0.90) 100%),
          linear-gradient(to bottom, rgba(0,0,0,0.20), rgba(0,0,0,0.78));
      }

      /* brilho suave se movendo (super sutil) */
      @keyframes slowGlowSweep {
        0% { transform: translateX(-40%) skewX(-16deg); opacity: 0; }
        18% { opacity: 0.10; }
        50% { opacity: 0.06; }
        82% { opacity: 0.10; }
        100% { transform: translateX(140%) skewX(-16deg); opacity: 0; }
      }
      .glow-sweep{
        position:absolute;
        inset:-30%;
        pointer-events:none;
        background: linear-gradient(
          90deg,
          rgba(255,255,255,0) 0%,
          rgba(255,255,255,0.06) 38%,
          rgba(255,255,255,0.14) 50%,
          rgba(255,255,255,0.06) 62%,
          rgba(255,255,255,0) 100%
        );
        filter: blur(2px);
        mix-blend-mode: screen;
        animation: slowGlowSweep 6.5s linear infinite;
        opacity: .9;
      }

      /* ===== Content ===== */
      .panel{
        position:relative;
        z-index:2;
        width:min(980px, 92vw);
        border-radius:22px;
        padding:28px 22px 22px;

        background: linear-gradient(to bottom, var(--panelA), var(--panelB));
        border: 1px solid var(--line);
        box-shadow:
          0 26px 64px rgba(0,0,0,0.62),
          inset 0 0 0 1px rgba(255,255,255,0.05);

        backdrop-filter: blur(2px);
        text-align:center;
        overflow:hidden;
      }

      /* detalhe “royal” no topo do painel */
      .panel::before{
        content:"";
        position:absolute;
        left:18px;
        right:18px;
        top:14px;
        height:1px;
        background: linear-gradient(90deg, rgba(255,204,102,0), rgba(255,204,102,0.65), rgba(255,204,102,0));
        opacity:.65;
        pointer-events:none;
      }

      .brand{
        display:flex;
        justify-content:center;
        align-items:center;
        gap:12px;
        margin-bottom:10px;
        flex-wrap:wrap;
      }

      .sigil{
        width:44px;
        height:44px;
        border-radius:12px;
        border:1px solid rgba(255,204,102,0.30);
        background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0.25));
        box-shadow: 0 10px 24px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.05);
        display:flex;
        align-items:center;
        justify-content:center;
        color: var(--goldB);
        text-shadow: 0 0 10px rgba(255,204,102,0.18);
        font-weight:700;
      }

      .title{
        margin:0;
        font-size: clamp(26px, 3.6vw, 46px);
        color: var(--goldA);
        letter-spacing: .6px;
        text-shadow:
          0 2px 14px rgba(0,0,0,0.90),
          0 0 22px rgba(255,204,102,0.10);
      }

      .subtitle{
        margin:10px auto 18px;
        max-width: 860px;
        color: var(--muted);
        font-size: clamp(14px, 1.6vw, 18px);
        line-height: 1.35;
        text-shadow: 0 2px 12px rgba(0,0,0,0.85);
      }

      .divider{
        height:1px;
        width:min(640px, 92%);
        margin: 0 auto 18px;
        background: linear-gradient(90deg, rgba(255,204,102,0), rgba(255,204,102,0.42), rgba(255,204,102,0));
        opacity:.55;
      }

      .actions{
        display:flex;
        justify-content:center;
        gap:12px;
        flex-wrap:wrap;
      }

      .btn-site{
        position:relative;
        display:inline-flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        padding:14px 22px;
        border-radius:14px;
        border:1px solid var(--lineStrong);
        text-decoration:none;

        color:#241404;
        font-weight:700;
        letter-spacing:.6px;

        background: linear-gradient(to bottom, rgba(255,244,202,0.96), rgba(255,204,102,0.92));
        box-shadow:
          0 18px 40px rgba(0,0,0,0.58),
          inset 0 0 0 1px rgba(255,255,255,0.28);

        transition: transform .15s ease, filter .15s ease;
        overflow:hidden;
        min-width: 170px;
      }

      .btn-site:hover{
        transform: translateY(-1px);
        filter: brightness(1.06);
      }

      /* shimmer no botão (sutil) */
      @keyframes btnShimmer {
        0% { transform: translateX(-140%) skewX(-18deg); opacity:0; }
        16% { opacity:0.32; }
        52% { opacity:0.18; }
        100% { transform: translateX(140%) skewX(-18deg); opacity:0; }
      }

      .btn-site::after{
        content:"";
        position:absolute;
        inset:-40%;
        background: linear-gradient(
          90deg,
          rgba(255,255,255,0) 0%,
          rgba(255,255,255,0.10) 36%,
          rgba(255,255,255,0.34) 50%,
          rgba(255,255,255,0.10) 64%,
          rgba(255,255,255,0) 100%
        );
        mix-blend-mode: screen;
        filter: blur(1px);
        animation: btnShimmer 3.8s linear infinite;
        pointer-events:none;
      }

      .micro{
        margin-top:14px;
        color: rgba(255,255,255,0.60);
        font-size: 12px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      }

      /* Mobile */
      @media (max-width: 600px){
        .panel{
          padding:22px 16px 18px;
          border-radius:18px;
        }
        .sigil{
          width:40px;height:40px;border-radius:12px;
        }
        .btn-site{
          width:100%;
          max-width:360px;
        }
      }
    </style>
  </head>

  <body>
    <main class="stage">
      <!-- Se o vídeo ainda não existir, isso não quebra a página -->
      <video class="bg-video" autoplay muted loop playsinline poster="./entrada-poster.jpg">
        <source src="./entrada.webm" type="video/webm" />
        <source src="./entrada.mp4" type="video/mp4" />
      </video>

      <!-- fallback visual + overlays -->
      <div class="bg-fallback"></div>
      <div class="vignette"></div>

      <section class="panel" aria-label="Entrada do site">
        <div class="glow-sweep"></div>

        <div class="brand">
          <div class="sigil">👑</div>
          <h1 class="title">Royal OtServlist</h1>
        </div>

        <p class="subtitle">
          Entre no salão real e descubra os servidores em destaque.
          Votação mensal, ranking e conteúdo da comunidade.
        </p>

        <div class="divider"></div>

        <div class="actions">
          <a class="btn-site" href="./index.html">SITE ➜</a>
        </div>

        <div class="micro">
          Dica: quando você subir <b>entrada.webm</b>, o fundo vira vídeo automaticamente.
        </div>
      </section>
    </main>
  </body>
</html>
