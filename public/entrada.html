<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Royal OtServlist — Entrada</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body{
      font-family:"Cinzel", serif;
      background:#000;
      overflow:hidden;
    }

    .stage{
      position:relative;
      width:100%;
      height:100%;
      transform: translateZ(0);
    }

    /* ===== VIDEO ===== */
    .bg-video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      transform: scale(1) translate3d(0,0,0);
      filter: contrast(1.02) saturate(1.02);
      will-change: transform, filter;
    }

    /* ===== BASE OVERLAY ===== */
    .overlay{
      position:absolute;
      inset:0;
      background:
        radial-gradient(1200px 700px at 50% 40%, rgba(0,0,0,0.04), rgba(0,0,0,0.75) 70%, rgba(0,0,0,0.95)),
        linear-gradient(to bottom, rgba(0,0,0,0.20), rgba(0,0,0,0.88));
      opacity:1;
      will-change: opacity;
    }

    /* ===== PORTAL (túnel) =====
       A mágica: usamos mask (webkit) com um radial-gradient.
       Quando anima, o “buraco” no centro encolhe até fechar.
    */
    .portal{
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:0;
      will-change: opacity, -webkit-mask-size, mask-size, transform, filter;

      /* escurece as bordas e cria uma borda dourada MUITO sutil */
      background:
        radial-gradient(closest-side at 50% 45%,
          rgba(0,0,0,0.00) 0%,
          rgba(0,0,0,0.00) 36%,
          rgba(0,0,0,0.25) 55%,
          rgba(0,0,0,0.70) 76%,
          rgba(0,0,0,0.98) 100%),
        radial-gradient(closest-side at 50% 45%,
          rgba(255,204,102,0.00) 0%,
          rgba(255,204,102,0.00) 44%,
          rgba(255,204,102,0.10) 52%,
          rgba(255,204,102,0.00) 62%);

      /* Máscara: centro transparente (passa), bordas fecham */
      -webkit-mask-image: radial-gradient(circle at 50% 45%, transparent 0 55%, #000 58% 100%);
      mask-image: radial-gradient(circle at 50% 45%, transparent 0 55%, #000 58% 100%);
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-size: 180% 180%;
      mask-size: 180% 180%;

      filter: blur(0px);
      transform: scale(1);
    }

    /* ===== CONTENT ===== */
    .content{
      position:relative;
      z-index:2;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:24px;
      will-change: transform, opacity;
    }

    .title{
      font-size: clamp(26px, 3.2vw, 42px);
      color:#f3e6c2;
      text-shadow: 0 3px 14px rgba(0,0,0,0.9);
      margin-bottom:28px;
      max-width: 900px;
      line-height: 1.25;
    }

    /* ========= BOTÃO PLACA ========= */
    .plate-button{
      position:relative;
      padding: 18px 48px;
      font-size: 18px;
      letter-spacing: 1px;
      color:#f1e0b5;
      text-decoration:none;
      text-transform:uppercase;

      background: linear-gradient(to bottom, #3b2b1c 0%, #2b1f15 40%, #1f160f 100%);
      border: 1px solid #6b4b1f;
      border-radius: 4px;

      box-shadow:
        inset 0 0 0 1px rgba(255,220,150,0.15),
        inset 0 -10px 20px rgba(0,0,0,0.6),
        0 14px 30px rgba(0,0,0,0.7);

      transition: transform 150ms ease, filter 150ms ease;
    }

    .plate-button::before{
      content:"";
      position:absolute;
      inset: 6px;
      border: 1px solid rgba(255,220,150,0.25);
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,0.6),
        inset 0 8px 14px rgba(255,255,255,0.05),
        inset 0 -12px 18px rgba(0,0,0,0.6);
      pointer-events:none;
    }

    .plate-button::after{
      content:"✦";
      position:absolute;
      top:-14px;
      left:50%;
      transform:translateX(-50%);
      font-size:18px;
      color:#d6b46a;
      text-shadow:0 2px 6px rgba(0,0,0,0.9);
    }

    .plate-button:hover{
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    @media (max-width: 600px){
      .plate-button{ padding:16px 32px; font-size:16px; }
    }

    /* ================================ */
    /* ========== ANIMAÇÕES ============ */
    /* ================================ */

    @keyframes camPull {
      0%   { transform: scale(1) translate3d(0,0,0); filter: contrast(1.02) saturate(1.02) blur(0px); }
      35%  { transform: scale(1.06) translate3d(0,-0.6%,0); filter: contrast(1.03) saturate(1.03) blur(0.3px); }
      70%  { transform: scale(1.20) translate3d(0,-1.8%,0); filter: contrast(1.05) saturate(1.05) blur(0.9px); }
      100% { transform: scale(1.34) translate3d(0,-2.4%,0); filter: contrast(1.06) saturate(1.05) blur(1.2px); }
    }

    @keyframes contentOut {
      0%   { transform: translate3d(0,0,0) scale(1); opacity:1; }
      45%  { transform: translate3d(0,-6px,0) scale(0.985); opacity:0.72; }
      100% { transform: translate3d(0,-18px,0) scale(0.94); opacity:0; }
    }

    @keyframes overlayDim {
      0% { opacity:1; }
      100% { opacity:0.78; }
    }

    /* Portal fechando: diminui o “buraco” (mask-size) + aumenta opacidade */
    @keyframes portalClose {
      0%   { opacity:0; -webkit-mask-size: 180% 180%; mask-size: 180% 180%; transform: scale(1); filter: blur(0px); }
      20%  { opacity:0.55; }
      60%  { opacity:0.85; -webkit-mask-size: 120% 120%; mask-size: 120% 120%; transform: scale(1.02); filter: blur(0.6px); }
      100% { opacity:1; -webkit-mask-size: 40% 40%; mask-size: 40% 40%; transform: scale(1.08); filter: blur(1px); }
    }

    body.is-entering .bg-video{
      transform-origin: 50% 45%;
      animation: camPull 820ms cubic-bezier(0.18, 0.82, 0.16, 1) forwards;
    }
    body.is-entering .content{
      animation: contentOut 520ms cubic-bezier(0.22, 0.8, 0.2, 1) forwards;
    }
    body.is-entering .overlay{
      animation: overlayDim 820ms cubic-bezier(0.18, 0.82, 0.16, 1) forwards;
    }
    body.is-entering .portal{
      animation: portalClose 820ms cubic-bezier(0.18, 0.82, 0.16, 1) forwards;
    }

    @media (prefers-reduced-motion: reduce){
      body.is-entering .bg-video,
      body.is-entering .content,
      body.is-entering .overlay,
      body.is-entering .portal{
        animation:none !important;
      }
    }
  </style>
</head>

<body>
  <main class="stage">
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="./entrada.webm" type="video/webm" />
      <source src="./entrada.mp4" type="video/mp4" />
    </video>

    <div class="overlay"></div>
    <div class="portal"></div>

    <section class="content">
      <h1 class="title">
        Bem-vindo ao Royal OtServlist,<br>
        a arena de honra e glória dos melhores servidores.
      </h1>

      <a href="./index.html" class="plate-button" id="enterBtn">
        Entrar no Site ▶
      </a>
    </section>
  </main>

  <script>
    const btn = document.getElementById("enterBtn");

    btn.addEventListener("click", (e) => {
      e.preventDefault();
      if (document.body.classList.contains("is-entering")) return;

      document.body.classList.add("is-entering");

      // alinha com o fechamento do portal
      setTimeout(() => {
        window.location.href = btn.getAttribute("href");
      }, 790);
    });
  </script>
</body>
</html>
