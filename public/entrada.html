<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Royal OtServlist — Entrada</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body{
      font-family:"Cinzel", serif;
      background:#000;
      overflow:hidden;
    }

    .stage{
      position:relative;
      width:100%;
      height:100%;
      transform: translateZ(0);
      isolation: isolate; /* evita “vazar” camadas */
    }

    /* ===== VIDEO ===== */
    .bg-video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      transform: scale(1) translate3d(0,0,0);
      will-change: transform;
      z-index: 0;
    }

    /* ===== OVERLAY BASE (fixo) ===== */
    .overlay{
      position:absolute;
      inset:0;
      z-index: 1;
      background:
        radial-gradient(1200px 700px at 50% 40%, rgba(0,0,0,0.04), rgba(0,0,0,0.70) 70%, rgba(0,0,0,0.92)),
        linear-gradient(to bottom, rgba(0,0,0,0.18), rgba(0,0,0,0.86));
      pointer-events:none;
      opacity: 1;
      will-change: opacity;
    }

    /* ===== PORTAL (LEVE, SEM MASK/BLUR) =====
       A “mágica” é animar o raio --r (em vmax), fechando o centro.
    */
    .portal{
      position:absolute;
      inset:0;
      z-index: 2;
      pointer-events:none;

      /* raio do buraco (inicial grande) */
      --r: 65vmax;
      --cx: 50%;
      --cy: 45%;

      opacity: 0;

      background:
        /* borda dourada MUITO sutil (anel) */
        radial-gradient(circle at var(--cx) var(--cy),
          rgba(255,204,102,0.00) 0%,
          rgba(255,204,102,0.00) calc(var(--r) - 3vmin),
          rgba(255,204,102,0.10) calc(var(--r) - 1.2vmin),
          rgba(255,204,102,0.00) calc(var(--r) + 1.2vmin)
        ),
        /* túnel escuro */
        radial-gradient(circle at var(--cx) var(--cy),
          rgba(0,0,0,0.00) 0%,
          rgba(0,0,0,0.00) calc(var(--r) - 6vmin),
          rgba(0,0,0,0.40) calc(var(--r) - 2vmin),
          rgba(0,0,0,0.80) calc(var(--r) + 8vmin),
          rgba(0,0,0,0.98) 100%
        );

      will-change: opacity;
      transform: translateZ(0);
    }

    /* ===== CONTENT ===== */
    .content{
      position:relative;
      z-index: 3;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:24px;
      will-change: transform, opacity;
    }

    .title{
      font-size: clamp(26px, 3.2vw, 42px);
      color:#f3e6c2;
      text-shadow: 0 3px 14px rgba(0,0,0,0.9);
      margin-bottom:28px;
      max-width: 900px;
      line-height: 1.25;
    }

    /* ========= BOTÃO PLACA ========= */
    .plate-button{
      position:relative;
      padding: 18px 48px;
      font-size: 18px;
      letter-spacing: 1px;
      color:#f1e0b5;
      text-decoration:none;
      text-transform:uppercase;

      background: linear-gradient(to bottom, #3b2b1c 0%, #2b1f15 40%, #1f160f 100%);
      border: 1px solid #6b4b1f;
      border-radius: 4px;

      box-shadow:
        inset 0 0 0 1px rgba(255,220,150,0.15),
        inset 0 -10px 20px rgba(0,0,0,0.6),
        0 14px 30px rgba(0,0,0,0.7);

      transition: transform 150ms ease, filter 150ms ease;
    }

    .plate-button::before{
      content:"";
      position:absolute;
      inset: 6px;
      border: 1px solid rgba(255,220,150,0.25);
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,0.6),
        inset 0 8px 14px rgba(255,255,255,0.05),
        inset 0 -12px 18px rgba(0,0,0,0.6);
      pointer-events:none;
    }

    .plate-button::after{
      content:"✦";
      position:absolute;
      top:-14px;
      left:50%;
      transform:translateX(-50%);
      font-size:18px;
      color:#d6b46a;
      text-shadow:0 2px 6px rgba(0,0,0,0.9);
    }

    .plate-button:hover{
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    @media (max-width: 600px){
      .plate-button{ padding:16px 32px; font-size:16px; }
    }

    /* ================================ */
    /* ========== ANIMAÇÕES ============ */
    /* ================================ */

    /* zoom cinematográfico sem “tranco” */
    @keyframes camPull {
      0%   { transform: scale(1) translate3d(0,0,0); }
      45%  { transform: scale(1.07) translate3d(0,-0.6%,0); }
      100% { transform: scale(1.18) translate3d(0,-1.3%,0); }
    }

    @keyframes contentOut {
      0%   { transform: translate3d(0,0,0) scale(1); opacity:1; }
      55%  { transform: translate3d(0,-8px,0) scale(0.985); opacity:0.7; }
      100% { transform: translate3d(0,-18px,0) scale(0.95); opacity:0; }
    }

    @keyframes overlayDim {
      0% { opacity: 1; }
      100% { opacity: 0.80; }
    }

    /* O portal fecha usando steps de --r (sem mask = sem “camada aparecendo”) */
    @keyframes portalClose {
      0%   { opacity: 0; --r: 65vmax; }
      12%  { opacity: 0.55; --r: 65vmax; }
      55%  { opacity: 0.85; --r: 32vmax; }
      100% { opacity: 1; --r: 0vmax; }
    }

    body.is-entering .bg-video{
      transform-origin: 50% 45%;
      animation: camPull 700ms cubic-bezier(0.18, 0.82, 0.16, 1) forwards;
    }
    body.is-entering .content{
      animation: contentOut 450ms cubic-bezier(0.22, 0.8, 0.2, 1) forwards;
    }
    body.is-entering .overlay{
      animation: overlayDim 700ms cubic-bezier(0.18, 0.82, 0.16, 1) forwards;
    }
    body.is-entering .portal{
      animation: portalClose 700ms cubic-bezier(0.18, 0.82, 0.16, 1) forwards;
    }

    @media (prefers-reduced-motion: reduce){
      body.is-entering .bg-video,
      body.is-entering .content,
      body.is-entering .overlay,
      body.is-entering .portal{
        animation:none !important;
      }
    }
  </style>
</head>

<body>
  <main class="stage">
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="./entrada.webm" type="video/webm" />
      <source src="./entrada.mp4" type="video/mp4" />
    </video>

    <div class="overlay"></div>
    <div class="portal"></div>

    <section class="content">
      <h1 class="title">
        Bem-vindo ao Royal OtServlist,<br>
        a arena de honra e glória dos melhores servidores.
      </h1>

      <a href="./index.html" class="plate-button" id="enterBtn">
        Entrar no Site ▶
      </a>
    </section>
  </main>

  <script>
    const btn = document.getElementById("enterBtn");

    btn.addEventListener("click", (e) => {
      e.preventDefault();
      if (document.body.classList.contains("is-entering")) return;

      document.body.classList.add("is-entering");

      // timing igual ao fechamento do portal (700ms)
      setTimeout(() => {
        window.location.href = btn.getAttribute("href");
      }, 660);
    });
  </script>
</body>
</html>
