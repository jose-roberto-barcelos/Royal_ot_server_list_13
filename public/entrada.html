<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Royal OtServlist — Entrada</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Cinzel", serif;
      background: #000;
      overflow: hidden;
    }

    /* ===== BACKGROUND ===== */
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(1200px 700px at 50% 40%, rgba(0,0,0,0.05), rgba(0,0,0,0.75) 70%, rgba(0,0,0,0.95)),
        linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0.85));
    }

    /* ===== CONTENT ===== */
    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .title {
      font-size: clamp(26px, 3.2vw, 42px);
      color: #f3e6c2;
      text-shadow: 0 3px 14px rgba(0,0,0,0.9);
      margin-bottom: 28px;
      max-width: 900px;
      line-height: 1.25;
    }

    /* ===================================================== */
    /* ============ BOTÃO PLACA MEDIEVAL REAL ============== */
    /* ===================================================== */

    .plate-button {
      position: relative;
      padding: 18px 48px;
      font-size: 18px;
      letter-spacing: 1px;
      color: #f1e0b5;
      text-decoration: none;
      text-transform: uppercase;

      background:
        linear-gradient(
          to bottom,
          #3b2b1c 0%,
          #2b1f15 40%,
          #1f160f 100%
        );

      border: 1px solid #6b4b1f;
      border-radius: 4px;

      box-shadow:
        inset 0 0 0 1px rgba(255,220,150,0.15),
        inset 0 -10px 20px rgba(0,0,0,0.6),
        0 14px 30px rgba(0,0,0,0.7);

    }

    /* borda interna entalhada */
    .plate-button::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(255,220,150,0.25);
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,0.6),
        inset 0 8px 14px rgba(255,255,255,0.05),
        inset 0 -12px 18px rgba(0,0,0,0.6);
      pointer-events: none;
    }

    /* ornamento central superior */
    .plate-button::after {
      content: "✦";
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      color: #d6b46a;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    .plate-button:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    @media (max-width: 600px) {
      .plate-button {
        padding: 16px 32px;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="stage">

    <!-- Vídeo (quando você colocar) -->
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="./entrada.webm" type="video/webm" />
      <source src="./entrada.mp4" type="video/mp4" />
    </video>

    <div class="overlay"></div>

    <section class="content">
      <h1 class="title">
        Bem-vindo ao Royal OtServlist,<br>
        a arena de honra e glória dos melhores servidores.
      </h1>

      <a href="./index.html" class="plate-button">
        Entrar no Site ▶
      </a>
    </section>
  </main>
</body>
</html>
