<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Royal OtServlist — Entrada</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root{
        /* ouro “real” */
        --gold-hi:#fff4c9;
        --gold:#ffcc66;
        --gold-lo:#a8741a;

        /* placa / metal */
        --plate-hi: rgba(255,255,255,0.16);
        --plate: rgba(0,0,0,0.52);
        --plate-lo: rgba(0,0,0,0.72);

        /* linhas */
        --line: rgba(255,204,102,0.28);
        --line2: rgba(255,204,102,0.45);
        --shadow: rgba(0,0,0,0.72);

        --text: rgba(255,255,255,0.92);
        --muted: rgba(255,255,255,0.76);
      }

      *{ box-sizing:border-box; }
      html,body{ height:100%; margin:0; }
      body{
        font-family:"Cinzel", serif;
        background:#000;
        overflow:hidden;
      }

      /* ===================== */
      /* Background (video)    */
      /* ===================== */
      .stage{
        position:relative;
        width:100%;
        height:100%;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:24px;
      }

      .bg-video{
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        object-fit:cover;
        object-position:center;
        transform: scale(1.03);
        filter: contrast(1.06) saturate(1.06);
      }

      .vignette{
        position:absolute;
        inset:0;
        pointer-events:none;
        background:
          radial-gradient(1100px 720px at 50% 35%, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0.64) 70%, rgba(0,0,0,0.92) 100%),
          linear-gradient(to bottom, rgba(0,0,0,0.18), rgba(0,0,0,0.78));
      }

      /* fallback caso não tenha vídeo ainda */
      .fallback{
        position:absolute;
        inset:0;
        background:
          radial-gradient(1100px 720px at 50% 35%, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.70) 72%, rgba(0,0,0,0.92) 100%),
          linear-gradient(to bottom, rgba(0,0,0,0.22), rgba(0,0,0,0.82));
      }

      /* ===================== */
      /* “Placa” medieval (UI) */
      /* ===================== */
      .plaque-wrap{
        position:relative;
        z-index:2;
        width:min(980px, 92vw);
      }

      .plaque{
        position:relative;
        border-radius: 22px;
        padding: 30px 26px 22px;
        text-align:center;
        overflow:hidden;

        /* placa com profundidade */
        background:
          radial-gradient(120% 100% at 50% 0%, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.00) 55%),
          linear-gradient(180deg, var(--plate-hi) 0%, var(--plate) 28%, var(--plate-lo) 100%);

        border: 1px solid var(--line);
        box-shadow:
          0 30px 70px rgba(0,0,0,0.62),
          inset 0 0 0 1px rgba(255,255,255,0.05),
          inset 0 18px 32px rgba(255,255,255,0.05),
          inset 0 -26px 44px rgba(0,0,0,0.55);
        backdrop-filter: blur(2px);
      }

      /* borda dupla “entalhada” */
      .plaque::before{
        content:"";
        position:absolute;
        inset: 10px;
        border-radius: 18px;
        pointer-events:none;

        background:
          radial-gradient(110% 90% at 50% 10%, rgba(255,204,102,0.12) 0%, rgba(255,204,102,0.00) 60%),
          linear-gradient(180deg, rgba(255,204,102,0.12), rgba(0,0,0,0.00));

        border: 1px solid rgba(255,204,102,0.18);
        box-shadow:
          inset 0 0 0 1px rgba(0,0,0,0.55),
          inset 0 12px 18px rgba(255,255,255,0.03),
          inset 0 -20px 26px rgba(0,0,0,0.45);
      }

      /* cantos ornamentados (tipo a arte) */
      .orn{
        position:absolute;
        width: 64px;
        height: 64px;
        pointer-events:none;
        opacity: 0.95;
        filter: drop-shadow(0 10px 16px rgba(0,0,0,0.55));
      }

      .orn::before{
        content:"";
        position:absolute;
        inset:0;
        border-radius: 18px;
        background:
          radial-gradient(70% 70% at 30% 30%, rgba(255,244,202,0.30) 0%, rgba(255,244,202,0.00) 60%),
          radial-gradient(80% 80% at 70% 70%, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.00) 60%),
          linear-gradient(180deg, rgba(255,244,202,0.12), rgba(0,0,0,0.00)),
          linear-gradient(135deg, rgba(255,204,102,0.30), rgba(168,116,26,0.18));

        border: 1px solid rgba(255,204,102,0.26);
        box-shadow:
          inset 0 0 0 1px rgba(0,0,0,0.55),
          inset 0 10px 16px rgba(255,255,255,0.05),
          inset 0 -14px 18px rgba(0,0,0,0.55);
        clip-path: polygon(0 0, 100% 0, 100% 38%, 62% 38%, 62% 100%, 0 100%);
      }

      .orn.tl{ top:-10px; left:-10px; transform: rotate(0deg); }
      .orn.tr{ top:-10px; right:-10px; transform: rotate(90deg); }
      .orn.br{ bottom:-10px; right:-10px; transform: rotate(180deg); }
      .orn.bl{ bottom:-10px; left:-10px; transform: rotate(270deg); }

      /* linha dourada central (bem “arte gerada”) */
      .gold-rule{
        width:min(720px, 92%);
        height:1px;
        margin: 14px auto 18px;
        background: linear-gradient(90deg, rgba(255,204,102,0), rgba(255,204,102,0.58), rgba(255,204,102,0));
        opacity: .8;
      }

      /* ===================== */
      /* Tipografia            */
      /* ===================== */
      .title{
        margin:0;
        font-size: clamp(26px, 3.8vw, 48px);
        color: var(--gold-hi);
        letter-spacing: .7px;
        text-shadow:
          0 2px 14px rgba(0,0,0,0.90),
          0 0 22px rgba(255,204,102,0.10);
      }

      .subtitle{
        margin:10px auto 0;
        max-width: 860px;
        color: var(--muted);
        font-size: clamp(14px, 1.6vw, 18px);
        line-height: 1.35;
        text-shadow: 0 2px 12px rgba(0,0,0,0.85);
      }

      /* ===================== */
      /* Botão “placa” (idêntico vibe) */
      /* ===================== */
      .actions{
        display:flex;
        justify-content:center;
        gap:12px;
        flex-wrap:wrap;
        margin-top:18px;
      }

      .btn-royal{
        position:relative;
        display:inline-flex;
        align-items:center;
        justify-content:center;
        min-width: 220px;
        padding: 14px 22px;
        border-radius: 16px;
        text-decoration:none;
        font-weight:700;
        letter-spacing: .8px;

        color: #1a0f05;

        /* “metal entalhado” */
        background:
          radial-gradient(120% 120% at 30% 10%, rgba(255,244,202,0.55) 0%, rgba(255,244,202,0.00) 55%),
          linear-gradient(180deg, rgba(255,244,202,0.98) 0%, rgba(255,204,102,0.92) 46%, rgba(168,116,26,0.92) 100%);

        border: 1px solid rgba(255,204,102,0.55);
        box-shadow:
          0 20px 42px rgba(0,0,0,0.60),
          inset 0 0 0 1px rgba(255,255,255,0.25),
          inset 0 10px 14px rgba(255,255,255,0.10),
          inset 0 -16px 22px rgba(0,0,0,0.35);

        transition: transform .15s ease, filter .15s ease;
        overflow:hidden;
      }

      .btn-royal:hover{
        transform: translateY(-1px);
        filter: brightness(1.06);
      }

      /* borda interna (relevo) */
      .btn-royal::before{
        content:"";
        position:absolute;
        inset: 7px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.38);
        box-shadow:
          inset 0 0 0 1px rgba(255,255,255,0.16),
          inset 0 -10px 14px rgba(0,0,0,0.18);
        pointer-events:none;
      }

      /* shimmer no botão (sutil, “reflexo”) */
      @keyframes btnShimmer {
        0% { transform: translateX(-140%) skewX(-18deg); opacity:0; }
        16% { opacity:0.28; }
        52% { opacity:0.18; }
        100% { transform: translateX(140%) skewX(-18deg); opacity:0; }
      }

      .btn-royal::after{
        content:"";
        position:absolute;
        inset:-40%;
        background: linear-gradient(
          90deg,
          rgba(255,255,255,0) 0%,
          rgba(255,255,255,0.10) 38%,
          rgba(255,255,255,0.30) 50%,
          rgba(255,255,255,0.10) 62%,
          rgba(255,255,255,0) 100%
        );
        mix-blend-mode: screen;
        filter: blur(1px);
        animation: btnShimmer 3.8s linear infinite;
        pointer-events:none;
      }

      .micro{
        margin-top:14px;
        color: rgba(255,255,255,0.62);
        font-size: 12px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      }

      /* mobile */
      @media (max-width: 600px){
        .plaque{ padding: 22px 16px 18px; border-radius: 18px; }
        .plaque::before{ inset: 8px; border-radius: 16px; }
        .orn{ width: 56px; height: 56px; }
        .btn-royal{ width: 100%; max-width: 380px; min-width: 0; }
      }
    </style>
  </head>

  <body>
    <main class="stage">
      <!-- Vídeo: quando você subir, ele aparece. Enquanto não tiver, não quebra. -->
      <video class="bg-video" autoplay muted loop playsinline poster="./entrada-poster.jpg">
        <source src="./entrada.webm" type="video/webm" />
        <source src="./entrada.mp4" type="video/mp4" />
      </video>

      <div class="fallback"></div>
      <div class="vignette"></div>

      <section class="plaque-wrap" aria-label="Entrada do site">
        <div class="plaque">
          <div class="orn tl"></div>
          <div class="orn tr"></div>
          <div class="orn br"></div>
          <div class="orn bl"></div>

          <h1 class="title">Royal OtServlist</h1>
          <p class="subtitle">
            Entre no salão real e descubra os servidores em destaque.
            Ranking, votação e conteúdo da comunidade.
          </p>

          <div class="gold-rule"></div>

          <div class="actions">
            <a class="btn-royal" href="./index.html">SITE ➜</a>
          </div>

          <div class="micro">
            Quando você subir <b>entrada.webm</b>, o fundo vira vídeo automaticamente.
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
