<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Royal OtServlist — Entrada</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root{
        --gold1:#fff2b0;
        --gold2:#ffcc66;
        --panelBorder: rgba(255,204,102,0.26);
      }

      *{ box-sizing:border-box; }
      html,body{ height:100%; margin:0; }
      body{
        font-family:"Cinzel", serif;
        background:#000;
        overflow:hidden;
      }

      .hero{
        position:relative;
        height:100%;
        width:100%;
        display:flex;
        align-items:center;
        justify-content:center;
        text-align:center;
        padding:24px;
      }

      /* VIDEO BACKGROUND */
      .bg-video{
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        object-fit:cover;
        object-position:center;
        transform:scale(1.02);
        filter:contrast(1.04) saturate(1.03);
      }

      /* overlays (cinema + legibilidade) */
      .vignette{
        position:absolute;
        inset:0;
        pointer-events:none;
        background:
          radial-gradient(1100px 700px at 50% 40%, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0.65) 68%, rgba(0,0,0,0.90) 100%),
          linear-gradient(to bottom, rgba(0,0,0,0.28), rgba(0,0,0,0.70));
      }

      /* Content card */
      .content{
        position:relative;
        z-index:2;
        width:min(980px, 92vw);
        padding:28px 22px 26px;
        border-radius:22px;
        background:linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0.40));
        border:1px solid var(--panelBorder);
        box-shadow:
          0 24px 60px rgba(0,0,0,0.55),
          inset 0 0 0 1px rgba(255,255,255,0.05);
        backdrop-filter: blur(2px);
      }

      .title{
        margin:0 0 10px 0;
        font-size:clamp(26px, 3.6vw, 44px);
        color:var(--gold1);
        text-shadow:0 2px 12px rgba(0,0,0,0.9);
        letter-spacing:.6px;
      }

      .subtitle{
        margin:0 auto 18px auto;
        max-width:820px;
        font-size:clamp(14px, 1.6vw, 18px);
        color:rgba(255,255,255,0.88);
        line-height:1.35;
        text-shadow:0 2px 10px rgba(0,0,0,0.85);
      }

      .actions{
        display:flex;
        justify-content:center;
        gap:12px;
        flex-wrap:wrap;
        margin-top:10px;
      }

      .btn-site{
        position:relative;
        display:inline-flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        padding:14px 22px;
        border-radius:14px;
        border:1px solid rgba(255,204,102,0.35);
        text-decoration:none;
        color:#2a1a05;
        font-weight:700;
        letter-spacing:.6px;
        background:
          linear-gradient(to bottom, rgba(255,244,202,0.95), rgba(255,204,102,0.90));
        box-shadow:
          0 18px 36px rgba(0,0,0,0.55),
          inset 0 0 0 1px rgba(255,255,255,0.30);
        transition:transform .15s ease, filter .15s ease;
        overflow:hidden;
      }
      .btn-site:hover{
        transform:translateY(-1px);
        filter:brightness(1.05);
      }

      /* brilho animado sutil no botão */
      @keyframes btnShimmer {
        0% { transform: translateX(-140%) skewX(-18deg); opacity:0; }
        15% { opacity:0.35; }
        55% { opacity:0.20; }
        100% { transform: translateX(140%) skewX(-18deg); opacity:0; }
      }

      .btn-site::after{
        content:"";
        position:absolute;
        inset:-40%;
        background:linear-gradient(
          90deg,
          rgba(255,255,255,0) 0%,
          rgba(255,255,255,0.10) 35%,
          rgba(255,255,255,0.35) 50%,
          rgba(255,255,255,0.10) 65%,
          rgba(255,255,255,0) 100%
        );
        mix-blend-mode: screen;
        filter: blur(1px);
        animation: btnShimmer 3.6s linear infinite;
        pointer-events:none;
      }

      @media (max-width: 600px){
        .content{ padding:22px 16px 20px; border-radius:18px; }
      }
    </style>
  </head>

  <body>
    <main class="hero">
      <!--
        Coloque seus arquivos em /public com estes nomes:
        - entrada.webm (recomendado, melhor no Chrome/Edge)
        - entrada.mp4  (fallback)
      -->
      <video class="bg-video" autoplay muted loop playsinline>
        <source src="./entrada.webm" type="video/webm" />
        <source src="./entrada.mp4" type="video/mp4" />
      </video>

      <div class="vignette"></div>

      <section class="content">
        <h1 class="title">Bem-vindo ao Royal OtServlist</h1>
        <p class="subtitle">
          A arena de honra e glória dos melhores servidores. Clique abaixo para entrar no site.
        </p>

        <div class="actions">
          <a class="btn-site" href="./index.html">SITE ➜</a>
        </div>
      </section>
    </main>
  </body>
</html>
