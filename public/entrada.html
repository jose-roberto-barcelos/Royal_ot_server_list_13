<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Royal OtServlist — Entrada</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body{
      font-family:"Cinzel", serif;
      background:#000;
      overflow:hidden;
    }

    .stage{
      position:relative;
      width:100%;
      height:100%;
      isolation:isolate; /* evita artefatos de camadas */
    }

    /* ===== VIDEO ===== */
    .bg-video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      transform: scale(1) translate3d(0,0,0);
      will-change: transform;
      transition: transform 720ms cubic-bezier(0.18, 0.82, 0.16, 1);
      z-index:0;
    }

    /* ===== OVERLAY BASE ===== */
    .overlay{
      position:absolute;
      inset:0;
      z-index:1;
      pointer-events:none;

      background:
        radial-gradient(1200px 700px at 50% 40%, rgba(0,0,0,0.04), rgba(0,0,0,0.70) 70%, rgba(0,0,0,0.92)),
        linear-gradient(to bottom, rgba(0,0,0,0.18), rgba(0,0,0,0.86));

      opacity:1;
      transition: opacity 720ms cubic-bezier(0.18, 0.82, 0.16, 1);
      will-change: opacity;
    }

    /* ===== VINHETA (CINEMA) — SEM CÍRCULO APARENTE ===== */
    .vignette{
      position:absolute;
      inset:0;
      z-index:2;
      pointer-events:none;

      /* vinheta suave, sem “borda circular” */
      background:
        radial-gradient(1400px 900px at 50% 45%,
          rgba(0,0,0,0.00) 0%,
          rgba(0,0,0,0.10) 55%,
          rgba(0,0,0,0.55) 78%,
          rgba(0,0,0,0.92) 100%);

      opacity:0.55;
      transition: opacity 720ms cubic-bezier(0.18, 0.82, 0.16, 1);
      will-change: opacity;
    }

    /* ===== FADE TO BLACK (final) ===== */
    .fade-black{
      position:absolute;
      inset:0;
      z-index:4;
      pointer-events:none;
      background:#000;
      opacity:0;
      transition: opacity 520ms cubic-bezier(0.22, 0.8, 0.2, 1);
      will-change: opacity;
    }

    /* ===== CONTENT ===== */
    .content{
      position:relative;
      z-index:3;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:24px;
      transition: transform 520ms cubic-bezier(0.22, 0.8, 0.2, 1), opacity 520ms cubic-bezier(0.22, 0.8, 0.2, 1);
      will-change: transform, opacity;
    }

    .title{
      font-size: clamp(26px, 3.2vw, 42px);
      color:#f3e6c2;
      text-shadow: 0 3px 14px rgba(0,0,0,0.9);
      margin-bottom:28px;
      max-width: 900px;
      line-height: 1.25;
    }

    /* ========= BOTÃO PLACA ========= */
    .plate-button{
      position:relative;
      padding: 18px 48px;
      font-size: 18px;
      letter-spacing: 1px;
      color:#f1e0b5;
      text-decoration:none;
      text-transform:uppercase;

      background: linear-gradient(to bottom, #3b2b1c 0%, #2b1f15 40%, #1f160f 100%);
      border: 1px solid #6b4b1f;
      border-radius: 4px;

      box-shadow:
        inset 0 0 0 1px rgba(255,220,150,0.15),
        inset 0 -10px 20px rgba(0,0,0,0.6),
        0 14px 30px rgba(0,0,0,0.7);

      transition: transform 150ms ease, filter 150ms ease, opacity 150ms ease;
    }

    .plate-button::before{
      content:"";
      position:absolute;
      inset: 6px;
      border: 1px solid rgba(255,220,150,0.25);
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,0.6),
        inset 0 8px 14px rgba(255,255,255,0.05),
        inset 0 -12px 18px rgba(0,0,0,0.6);
      pointer-events:none;
    }

    .plate-button::after{
      content:"✦";
      position:absolute;
      top:-14px;
      left:50%;
      transform:translateX(-50%);
      font-size:18px;
      color:#d6b46a;
      text-shadow:0 2px 6px rgba(0,0,0,0.9);
    }

    .plate-button:hover{
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    @media (max-width: 600px){
      .plate-button{ padding:16px 32px; font-size:16px; }
    }

    /* ===================== */
    /* ===== ENTER FX ====== */
    /* ===================== */
    body.is-entering .bg-video{
      transform: scale(1.22) translate3d(0,-1.2%,0);
    }
    body.is-entering .overlay{
      opacity:0.72;
    }
    body.is-entering .vignette{
      opacity:0.95;
    }
    body.is-entering .content{
      transform: translate3d(0,-14px,0) scale(0.96);
      opacity:0;
    }
    body.is-entering .plate-button{
      opacity:0; /* tira o botão do olho durante a transição */
    }

    /* segunda etapa: blackout final (sem círculo, sem pausa) */
    body.is-entering.is-blackout .fade-black{
      opacity:1;
    }

    @media (prefers-reduced-motion: reduce){
      .bg-video, .overlay, .vignette, .content, .fade-black{
        transition:none !important;
      }
    }
  </style>
</head>

<body>
  <main class="stage">
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="./entrada.webm" type="video/webm" />
      <source src="./entrada.mp4" type="video/mp4" />
    </video>

    <div class="overlay"></div>
    <div class="vignette"></div>
    <div class="fade-black" id="fadeBlack"></div>

    <section class="content">
      <h1 class="title">
        Bem-vindo ao Royal OtServlist,<br>
        a arena de honra e glória dos melhores servidores.
      </h1>

      <a href="./index.html" class="plate-button" id="enterBtn">
        Entrar no Site ▶
      </a>
    </section>
  </main>

  <script>
    const btn = document.getElementById("enterBtn");
    const fadeBlack = document.getElementById("fadeBlack");

    btn.addEventListener("click", (e) => {
      e.preventDefault();
      if (document.body.classList.contains("is-entering")) return;

      document.body.classList.add("is-entering");

      // força o browser a aplicar a classe sem “freada”
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          document.body.classList.add("is-blackout");
        });
      });

      // quando o blackout terminar, navega (sem pause ridícula)
      const go = () => { window.location.href = btn.getAttribute("href"); };
      fadeBlack.addEventListener("transitionend", go, { once: true });
    });
  </script>
</body>
</html>
