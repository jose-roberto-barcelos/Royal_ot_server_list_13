<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Royal OtServlist — Entrada</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body{
      font-family:"Cinzel", serif;
      background:#000;
      overflow:hidden;
    }

    .stage{
      position:relative;
      width:100%;
      height:100%;
      isolation:isolate;
    }

    /* ===== VIDEO ===== */
    .bg-video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      transform: scale(1) translate3d(0,0,0);
      will-change: transform;
      transition: transform 720ms cubic-bezier(0.18, 0.82, 0.16, 1);
      z-index:0;
    }

    /* ===== OVERLAY BASE ===== */
    .overlay{
      position:absolute;
      inset:0;
      z-index:1;
      pointer-events:none;
      background:
        radial-gradient(1200px 700px at 50% 40%, rgba(0,0,0,0.04), rgba(0,0,0,0.70) 70%, rgba(0,0,0,0.92)),
        linear-gradient(to bottom, rgba(0,0,0,0.18), rgba(0,0,0,0.86));
      opacity:1;
      transition: opacity 720ms cubic-bezier(0.18, 0.82, 0.16, 1);
      will-change: opacity;
    }

    /* ===== VINHETA (CINEMA) ===== */
    .vignette{
      position:absolute;
      inset:0;
      z-index:2;
      pointer-events:none;
      background:
        radial-gradient(1400px 900px at 50% 45%,
          rgba(0,0,0,0.00) 0%,
          rgba(0,0,0,0.10) 55%,
          rgba(0,0,0,0.55) 78%,
          rgba(0,0,0,0.92) 100%);
      opacity:0.55;
      transition: opacity 720ms cubic-bezier(0.18, 0.82, 0.16, 1);
      will-change: opacity;
    }

    /* ===== BLACKOUT FINAL (curto) ===== */
    .fade-black{
      position:absolute;
      inset:0;
      z-index:4;
      pointer-events:none;
      background:#000;
      opacity:0;
      /* curto e rápido */
      transition: opacity 200ms cubic-bezier(0.22, 0.8, 0.2, 1);
      will-change: opacity;
    }

    /* ===== CONTENT ===== */
    .content{
      position:relative;
      z-index:3;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:24px;
      transition: transform 520ms cubic-bezier(0.22, 0.8, 0.2, 1), opacity 520ms cubic-bezier(0.22, 0.8, 0.2, 1);
      will-change: transform, opacity;
    }

    .title{
      font-size: clamp(26px, 3.2vw, 42px);
      color:#f3e6c2;
      text-shadow: 0 3px 14px rgba(0,0,0,0.9);
      margin-bottom:28px;
      max-width: 900px;
      line-height: 1.25;
    }

    /* =============================== */
    /* ========== BOTÃO REAL ========= */
    /* =============================== */
    .plate-button{
      position:relative;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      padding: 18px 56px;
      font-size: 18px;
      letter-spacing: 1.1px;
      text-decoration:none;
      text-transform:uppercase;
      border-radius: 8px;

      /* texto ouro claro */
      color: rgba(255, 245, 215, 0.96);
      text-shadow:
        0 1px 0 rgba(0,0,0,0.65),
        0 0 16px rgba(255, 204, 102, 0.12);

      /* base metal escuro */
      background:
        radial-gradient(120% 160% at 50% 0%, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.00) 52%),
        linear-gradient(to bottom,
          #3b2b1c 0%,
          #2b1f15 45%,
          #1b120c 100%);

      /* borda ouro metálico */
      border: 1px solid rgba(255, 204, 102, 0.58);

      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,0.70),
        inset 0 10px 16px rgba(255,255,255,0.05),
        inset 0 -16px 26px rgba(0,0,0,0.76),
        0 18px 38px rgba(0,0,0,0.74);

      transition: transform 150ms ease, filter 150ms ease;
      overflow:hidden;
    }

    /* borda interna entalhada + filete dourado */
    .plate-button::before{
      content:"";
      position:absolute;
      inset: 7px;
      border-radius: 6px;
      border: 1px solid rgba(255, 204, 102, 0.26);
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,0.75),
        inset 0 0 0 2px rgba(255, 204, 102, 0.10),
        inset 0 10px 14px rgba(255,255,255,0.04),
        inset 0 -14px 22px rgba(0,0,0,0.76);
      pointer-events:none;
    }

    /* faixa dourada superior (detalhe royal) */
    .plate-button .cap{
      position:absolute;
      left:10px;
      right:10px;
      top:8px;
      height:10px;
      border-radius: 999px;
      background:
        linear-gradient(90deg,
          rgba(255,204,102,0.00) 0%,
          rgba(255,204,102,0.34) 22%,
          rgba(255,248,220,0.22) 50%,
          rgba(255,204,102,0.34) 78%,
          rgba(255,204,102,0.00) 100%);
      opacity:0.95;
      pointer-events:none;
    }

    /* shimmer metálico bem sutil */
    @keyframes metalShimmer {
      0%   { transform: translateX(-160%) skewX(-18deg); opacity: 0; }
      20%  { opacity: 0.16; }
      60%  { opacity: 0.10; }
      100% { transform: translateX(160%) skewX(-18deg); opacity: 0; }
    }
    .plate-button::after{
      content:"";
      position:absolute;
      inset:-50%;
      background: linear-gradient(
        90deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.06) 38%,
        rgba(255,255,255,0.16) 50%,
        rgba(255,255,255,0.06) 62%,
        rgba(255,255,255,0) 100%
      );
      mix-blend-mode: screen;
      filter: blur(1px);
      animation: metalShimmer 3.8s linear infinite;
      pointer-events:none;
      opacity: 0.9;
    }

    .orn{
      position:absolute;
      top:-14px;
      left:50%;
      transform:translateX(-50%);
      font-size:18px;
      color: rgba(255, 204, 102, 0.92);
      text-shadow:0 2px 6px rgba(0,0,0,0.9);
      pointer-events:none;
    }

    .plate-button:hover{
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    @media (max-width: 600px){
      .plate-button{ padding:16px 34px; font-size:16px; }
    }

    /* ===================== */
    /* ===== ENTER FX ====== */
    /* ===================== */
    body.is-entering .bg-video{
      transform: scale(1.18) translate3d(0,-1.0%,0);
    }
    body.is-entering .overlay{
      opacity:0.78;
    }
    body.is-entering .vignette{
      opacity:0.92;
    }
    body.is-entering .content{
      transform: translate3d(0,-14px,0) scale(0.96);
      opacity:0;
    }

    /* blackout curto */
    body.is-entering.is-blackout .fade-black{
      opacity:1;
    }

    @media (prefers-reduced-motion: reduce){
      .bg-video, .overlay, .vignette, .content, .fade-black{ transition:none !important; }
      .plate-button::after{ animation:none !important; }
    }
  </style>
</head>

<body>
  <main class="stage">
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="./entrada.webm" type="video/webm" />
      <source src="./entrada.mp4" type="video/mp4" />
    </video>

    <div class="overlay"></div>
    <div class="vignette"></div>
    <div class="fade-black" id="fadeBlack"></div>

    <section class="content">
      <h1 class="title">
        Bem-vindo ao Royal OtServlist,<br>
        a arena de honra e glória dos melhores servidores.
      </h1>

      <a href="./index.html" class="plate-button" id="enterBtn">
        <span class="cap"></span>
        <span class="orn">✦</span>
        Entrar no Site ▶
      </a>
    </section>
  </main>

  <script>
    const btn = document.getElementById("enterBtn");

    btn.addEventListener("click", (e) => {
      e.preventDefault();
      if (document.body.classList.contains("is-entering")) return;

      document.body.classList.add("is-entering");

      // blackout aparece só como “piscar” (bem curto)
      requestAnimationFrame(() => {
        document.body.classList.add("is-blackout");
      });

      // ✅ navega rápido (sem ficar com tela preta parada)
      setTimeout(() => {
        window.location.href = btn.getAttribute("href");
      }, 120); // se ainda ficar preto: coloque 80
    });
  </script>
</body>
</html>
