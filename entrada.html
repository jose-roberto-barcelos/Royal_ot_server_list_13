<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Royal OtServlist — Entrada</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root{
        --gold1:#fff2b0;
        --gold2:#ffcc66;
        --bgShadow:rgba(0,0,0,.72);
      }

      *{ box-sizing:border-box; }
      html,body{ height:100%; margin:0; }
      body{
        font-family:"Cinzel", serif;
        overflow:hidden;
        background:#000;
      }

      .hero{
        position:relative;
        height:100%;
        width:100%;
        display:flex;
        align-items:center;
        justify-content:center;
        text-align:center;
        padding:24px;
      }

      .bg{
        position:absolute;
        inset:0;
        background-image:url("./entrada-bg.png"); /* sua imagem limpa */
        background-size:cover;
        background-position:center;
        transform:scale(1.02);
        filter:contrast(1.05) saturate(1.05);
      }

      .vignette{
        position:absolute;
        inset:0;
        background:
          radial-gradient(1100px 700px at 50% 40%, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0.65) 68%, rgba(0,0,0,0.88) 100%),
          linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(0,0,0,0.78));
        pointer-events:none;
      }

      .content{
        position:relative;
        z-index:2;
        width:min(980px, 92vw);
        padding:28px 22px 26px;
        border-radius:22px;
        background:linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0.40));
        border:1px solid rgba(255,204,102,0.26);
        box-shadow:
          0 24px 60px rgba(0,0,0,0.55),
          inset 0 0 0 1px rgba(255,255,255,0.05);
      }

      .title{
        margin:0 0 10px 0;
        font-size:clamp(26px, 3.6vw, 44px);
        color:var(--gold1);
        text-shadow:0 2px 12px rgba(0,0,0,0.9);
        letter-spacing:.6px;
      }

      .subtitle{
        margin:0 auto 18px auto;
        max-width:820px;
        font-size:clamp(14px, 1.6vw, 18px);
        color:rgba(255,255,255,0.88);
        line-height:1.35;
        text-shadow:0 2px 10px rgba(0,0,0,0.85);
      }

      .actions{
        display:flex;
        justify-content:center;
        gap:12px;
        flex-wrap:wrap;
        margin-top:10px;
      }

      .btn-site{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        padding:14px 22px;
        border-radius:14px;
        border:1px solid rgba(255,204,102,0.35);
        text-decoration:none;
        color:#2a1a05;
        font-weight:700;
        letter-spacing:.6px;
        background:
          linear-gradient(to bottom, rgba(255,244,202,0.95), rgba(255,204,102,0.90));
        box-shadow:
          0 18px 36px rgba(0,0,0,0.55),
          inset 0 0 0 1px rgba(255,255,255,0.30);
        transition:transform .15s ease, filter .15s ease;
      }
      .btn-site:hover{
        transform:translateY(-1px);
        filter:brightness(1.05);
      }
    </style>
  </head>

  <body>
    <main class="hero">
      <div class="bg"></div>
      <div class="vignette"></div>

      <section class="content">
        <h1 class="title">Bem-vindo ao Royal OtServlist</h1>
        <p class="subtitle">
          A arena de honra e glória dos melhores servidores. Clique abaixo para entrar no site.
        </p>

        <div class="actions">
          <a class="btn-site" href="./index.html">SITE ➜</a>
        </div>
      </section>
    </main>
  </body>
</html>
